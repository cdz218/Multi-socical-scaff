[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["multichannel", "multichannel.sources"]

[project]
name = "multichannel"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.10,<3", "httpx>=0.28,<0.29", "kokoro==0.9.4",
  "soundfile>=0.14,<0.15", "google-api-python-client>=2.160,<3",
  "google-auth-oauthlib>=1.2,<2", "google-auth-httplib2>=0.2,<1",
  "praw>=7.8,<8", "Pillow>=11.1,<12", "jsonschema>=4.23,<5"
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-httpx>=0.35,<0.36", "ruff>=0.9,<0.10", "mypy>=1.14,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
