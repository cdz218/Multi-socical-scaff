name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }} --locked
      - run: uv run pytest -q
      - run: uv run ruff check multichannel tests scripts
      - run: uv run mypy multichannel scripts/bootstrap_kokoro.py
      - run: uv lock --check
